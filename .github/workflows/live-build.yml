name: live-build

# TV 直播表构建（名册驱动）—— 本表 v1/live/normal.m3u 的【唯一作者】。
# 起因（2026-09-30 主人钦定「不要依赖本机和局域网」）：
#   本表此前由「本机实测链路」推送 —— 本机不开机，表就不更新；且与 iOS 仓的
#   live-refresh 撞车（后者已隔离到 ios.m3u，见 P-2026-09-30-G）。
#   现改为云端按名册（roster.json 332 台）重建：结构（频道号/分组/台标）恒定，
#   源 = 继承线上现表 + 公开源池补充；可用性由端侧多源静默切换兜底。
on:
  schedule:
    - cron: "23 */6 * * *"     # 每 6 小时
  workflow_dispatch:           # 手动触发
    inputs:
      push:
        description: "true=加密并发布；false=只构建"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install --quiet cryptography

      - name: 按名册重建直播表
        env:
          FC_VAULT_KEY: ${{ secrets.FC_VAULT_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DO_PUSH: ${{ github.event.inputs.push || 'true' }}
        run: |
          set -e
          if [ "$DO_PUSH" = "true" ]; then
            python tools/live/build_tv_table.py --inherit-remote --push
          else
            python tools/live/build_tv_table.py --inherit-remote
          fi

      - name: 清理 CDN 边缘缓存
        if: ${{ (github.event.inputs.push || 'true') == 'true' }}
        run: |
          curl -s --max-time 40 "https://purge.jsdelivr.net/gh/lidawei1985/filmcollector-pages-xingmu@main/v1/live/normal.m3u" || true
